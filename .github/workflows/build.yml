name: Build Heart Health Monitor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name HeartHealthMonitor bp_monitor.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HeartHealthMonitor-Windows
          path: dist/HeartHealthMonitor.exe

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name HeartHealthMonitor bp_monitor.py

      - name: Make executable runnable
        run: |
          chmod +x dist/HeartHealthMonitor

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: HeartHealthMonitor-Linux
          path: dist/HeartHealthMonitor
